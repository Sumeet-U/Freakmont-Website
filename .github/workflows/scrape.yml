name: Daily Guild Scrape

on:
  schedule:
    # 09:17 UTC daily. Off the top of the hour on purpose -- GitHub Actions
    # queues cron jobs and exact-hour times are the most congested, so
    # they're the most likely to run late. Adjust the hour to whenever you
    # want the site to refresh; keep the odd minute.
    - cron: '17 9 * * *'
  # Lets you trigger a run manually from the Actions tab, e.g. to pick up
  # the rest of a batch after mapleidle.gg's rate limit clears mid-day.
  workflow_dispatch: {}

# If a manual run is triggered while the scheduled one is still going,
# queue it instead of running both at once -- two runs writing to the same
# files at the same time would race on the git push.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    # Runs on your own Windows machine instead of GitHub's shared pool --
    # mapleidle.gg/msidle.gg block GitHub-hosted runners' IP range outright
    # (429/403 on the very first request), which a home IP doesn't hit.
    # Machine must be on and connected at 09:17 UTC for the schedule to
    # fire; see SETUP.md for how the runner service was installed.
    runs-on: [self-hosted, Windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_guild.py

      - name: Run Guild War forecast scraper
        # Separate step so a failure here (or simply no active matchup in
        # gw-opponents.json) never blocks committing the main daily scrape
        # above -- scrape_gw_forecast.py itself already exits cleanly when
        # there's no configured matchup; this guards against anything
        # unexpected too.
        run: python scrape_gw_forecast.py || echo "Guild War forecast step failed or skipped, continuing."

      - name: Commit and push updated data
        run: |
          git config user.name "freakmont-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes today, skipping commit."
          else
            git commit -m "Daily scrape: $(date -u +'%Y-%m-%d')"
            git push
          fi
